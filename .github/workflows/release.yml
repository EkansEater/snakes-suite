# Builds the tools and the one-file Snake's Suite app on Linux, Windows and macOS,
# then publishes them as a GitHub release. The app downloads tools from the latest release.
# Only what changed is built: a tool (or the app) whose version is the same as in the
# latest release is copied from that release instead.
#
#   Run it: push a tag like v1.0.1, or start it by hand from the Actions tab
#   (tick "Build everything" after changing packaging/ or this file).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      full:
        description: "Build everything, even tools that did not change"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # an older Ubuntu, so the Linux builds run on older distributions too
          - os: windows-2022      # has the Visual Studio that node-gyp knows (Snake's Code's terminal)
          - os: macos-15          # Apple silicon
          - os: macos-15-intel    # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev liblilv-dev \
            libgirepository1.0-dev libcairo2-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfuse2 rpm

      - name: Python tools' requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller \
            "./tools/Snake's Converter" "./tools/Snake's MP3 Converter" "./tools/Snake's Screen Recorder" \
            "./tools/Snake's SoundPad" ./hub
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install "PyGObject<3.51"
          fi

      # ffmpeg for Player and Movie Maker: built from pinned sources on Linux and macOS
      # (about ten minutes), downloaded and checked on Windows. Kept in the cache until
      # packaging/ffmpeg/ changes. If it fails, Snake's Studio ships without it.
      - name: ffmpeg from the cache
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/ffmpeg/**') }}

      - name: ffmpeg for Snake's Studio
        id: ffbuild
        if: steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y nasm meson ninja-build ;;
            macOS) brew install nasm meson ninja pkgconf ;;
          esac
          python packaging/build.py ffmpeg build/ffmpeg

      - name: Keep ffmpeg in the cache
        if: steps.ffbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/ffmpeg
          key: ${{ steps.ffcache.outputs.cache-primary-key }}

      - name: Build the tools
        shell: bash
        run: |
          if [ -f build/ffmpeg/README.txt ]; then export SNAKE_FFMPEG_DIR="$PWD/build/ffmpeg"; fi
          python packaging/build.py tools ${{ inputs.full && ' ' || '--reuse' }}

      - name: Build Snake's Suite (one file)
        if: always()
        shell: bash
        run: python packaging/build.py hub ${{ inputs.full && ' ' || '--reuse' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snakes-suite-${{ matrix.os }}
          path: |
            release/snakes-*
            release/Snakes-Suite-*
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Android apps from the last release
        run: python packaging/build.py android dist
      - name: Index for the app (signed when the SNAKE_INDEX_KEY secret is set)
        env:
          SNAKE_INDEX_KEY: ${{ secrets.SNAKE_INDEX_KEY }}
        run: |
          python -m pip install cryptography
          python packaging/build.py index dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="v$(python -c 'import json;print(json.load(open("suite.json"))["version"])')"; fi
          notes="Download **Snake's Master Suite** for your system below (Snakes-Suite-…), open it, and pick the tools you want.

          - Windows: \`Snakes-Suite-windows-x86_64.exe\`. If SmartScreen warns about an unknown publisher, choose *More info → Run anyway*.
          - macOS: \`Snakes-Suite-macos-arm64.dmg\` (Apple silicon) or \`-x86_64.dmg\` (Intel). The first time, right-click the app and choose *Open*.
          - Linux: \`Snakes-Suite-linux-x86_64\`. Make it executable (\`chmod +x\`), then run it.

          The other files are the tools themselves; the app downloads them for you."
          shopt -s nullglob  # publish what was built, even if one system had a problem
          gh release delete "$tag" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$tag" --title "Snake's Master Suite ${tag#v}" --notes "$notes" --latest \
            dist/index.json* dist/Snakes-Suite-* dist/snakes-*.tar.gz dist/snakes-*.zip dist/snakes-*.apk
