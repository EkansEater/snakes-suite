# The online mirror: Snake's Studio's apps (Word, Spreadsheets, Slides, Paint, Photo,
# Player, Movie Maker) as a website on GitHub Pages:
#
#     https://ekanseater.github.io/snakes-suite/
#
# Runs when the Studio changes on main, or by hand from the Actions tab.
# Once, before the first run: Settings → Pages → Source: "GitHub Actions".
name: Web mirror

on:
  push:
    branches: [main]
    paths: ["tools/Snake's Studio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web apps
        working-directory: tools/Snake's Studio
        run: |
          npm ci --ignore-scripts   # the website needs esbuild, not Electron's download
          node build.mjs
          node test/sheets.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/Snake's Studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
