# Snake's Master Suite for iPhone and iPad, built on GitHub's Macs (this repository is public,
# so they cost nothing). Runs when the iOS app, the Studio or Snake's Code changes on main, or by hand.
#
# Without an Apple Developer account the app cannot be signed here, so this makes:
#   - a check that the code builds (for the simulator), and
#   - snakes-master-suite-ios-unsigned.ipa (an artifact of the run): an app you can put on your
#     own iPhone with a sideloading tool that signs it with your Apple ID (AltStore,
#     Sideloadly). Apple limits such apps to 7 days before they need signing again.
# With a paid account ($99/year) the same project can go to TestFlight or the App Store.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "tools/Snake's Studio/**", "tools/Snake's Code/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Snake's Code (its web version goes into the app)
        working-directory: tools/Snake's Code
        run: |
          npm ci --ignore-scripts   # no Electron download, no native terminal module
          node build.mjs
      - name: The Studio's pages
        working-directory: tools/Snake's Studio
        run: |
          npm ci --ignore-scripts   # esbuild only, not Electron's download
          node build.mjs
      - name: Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          rm -rf studio && cp -R "../tools/Snake's Studio/dist" studio
          rm -f studio/sw.js   # the website's offline copy; the app has its files already
          # The app's version is the suite's (suite.json), as for the hub on the desktop and Android.
          echo "SUITE_VERSION=$(python3 -c "import json; print(json.load(open('../suite.json'))['version'])")" >> "$GITHUB_ENV"
          echo "SUITE_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Generate
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator (checks the code)
        working-directory: ios
        run: |
          xcodebuild -project SnakesMasterSuite.xcodeproj -scheme SnakesMasterSuite -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
      - name: Unsigned app for iPhone
        working-directory: ios
        run: |
          xcodebuild -project SnakesMasterSuite.xcodeproj -scheme SnakesMasterSuite -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SnakesMasterSuite.app Payload/
          zip -qry snakes-master-suite-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: snakes-master-suite-ios-unsigned
          path: ios/snakes-master-suite-ios-unsigned.ipa
