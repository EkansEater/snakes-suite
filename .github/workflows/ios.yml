# Snake's Studio for iPhone and iPad, built on GitHub's Macs (this repository is public,
# so they cost nothing). Runs when the iOS app or the Studio changes on main, or by hand.
#
# Without an Apple Developer account the app cannot be signed here, so this makes:
#   - a check that the code builds (for the simulator), and
#   - snakes-studio-ios-unsigned.ipa (an artifact of the run): an app you can put on your
#     own iPhone with a sideloading tool that signs it with your Apple ID (AltStore,
#     Sideloadly). Apple limits such apps to 7 days before they need signing again.
# With a paid account ($99/year) the same project can go to TestFlight or the App Store.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "tools/Snake's Studio/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The Studio's pages
        working-directory: tools/Snake's Studio
        run: |
          npm ci --ignore-scripts   # esbuild only, not Electron's download
          node build.mjs
      - name: Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          rm -rf studio && cp -R "../tools/Snake's Studio/dist" studio
          rm -f studio/sw.js   # the website's offline copy; the app has its files already
          # The app's version: the newest of the seven Studio apps' (as on Android and the desktop).
          echo "STUDIO_VERSION=$(python3 -c "import json; v=[t['version'] for t in json.load(open('../suite.json'))['tools'] if t.get('studio_app')]; print(max(v, key=lambda s: [int(x) for x in s.split('.')]))")" >> "$GITHUB_ENV"
          echo "STUDIO_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Generate
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator (checks the code)
        working-directory: ios
        run: |
          xcodebuild -project SnakesStudio.xcodeproj -scheme SnakesStudio -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
      - name: Unsigned app for iPhone
        working-directory: ios
        run: |
          xcodebuild -project SnakesStudio.xcodeproj -scheme SnakesStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SnakesStudio.app Payload/
          zip -qry snakes-studio-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: snakes-studio-ios-unsigned
          path: ios/snakes-studio-ios-unsigned.ipa
