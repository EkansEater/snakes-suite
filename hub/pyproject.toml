[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakes-suite"
version = "1.1.0"
description = "Snake's Suite: every Snake tool in one place."
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.gui-scripts]
snakes-suite = "snakes_suite.app:main"

[tool.setuptools]
packages = ["snakes_suite"]

[tool.setuptools.package-data]
snakes_suite = ["assets/*", "catalogue.json"]
