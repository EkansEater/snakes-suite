[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakescreen"
version = "1.1.0"
description = "Simple screen and audio recorder: MP4, GIF and MP3, with region capture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
    # ships an ffmpeg binary, used when no system ffmpeg is installed
    "imageio-ffmpeg>=0.4; sys_platform != 'linux'",
]

[project.gui-scripts]
snakescreen = "snakescreen.__main__:main"

[tool.setuptools]
packages = ["snakescreen"]

[tool.setuptools.package-data]
snakescreen = ["assets/*"]
